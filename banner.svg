<svg width="820" height="260" viewBox="0 0 820 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.95; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes fillBar {
      0% { width: 40px; }
      60% { width: 220px; }
      100% { width: 220px; }
    }
    @keyframes spinBall {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-12deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(12deg); }
      100% { transform: rotate(0deg); }
    }
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 30px;
      fill: #F0F6FC;
    }
    .subtitle {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 14px;
      fill: #79C0FF;
    }
    .dialog-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 15px;
      fill: #E6EDF3;
    }
    .badge-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 12px;
      fill: #071324;
    }
    .star1 { animation: pulseGlow 2.4s infinite ease-in-out; }
    .star2 { animation: pulseGlow 3.1s infinite ease-in-out 0.8s; }
    .star3 { animation: pulseGlow 2.7s infinite ease-in-out 1.4s; }
    .float-el { animation: floatSlow 3.5s infinite ease-in-out; }
    .cursor { animation: blink 1s infinite; }
    .xp-fill { animation: fillBar 4s ease-out forwards; }
    .pokeball-wiggle {
      transform-origin: 735px 82px;
      animation: spinBall 2.8s infinite ease-in-out;
    }
  </style>

  <defs>
    <linearGradient id="techBlueBg" x1="0" y1="0" x2="820" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071830" />
      <stop offset="50%" stop-color="#0E2A52" />
      <stop offset="100%" stop-color="#1A5FA8" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="680" cy="85" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#071830" stop-opacity="0" />
    </radialGradient>
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38BDF8" stroke-opacity="0.11" stroke-width="1" />
      <circle cx="0" cy="0" r="1.2" fill="#7DD3FC" fill-opacity="0.25" />
    </pattern>
  </defs>

  <rect x="2" y="2" width="816" height="256" rx="16" fill="url(#techBlueBg)" stroke="#2563EB" stroke-opacity="0.65" stroke-width="2" />
  <rect x="2" y="2" width="816" height="256" rx="16" fill="url(#techGrid)" />
  <rect x="2" y="2" width="816" height="256" rx="16" fill="url(#cyanGlow)" />

  <path d="M 480 24 H 610 L 626 40 H 670" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.5" />
  <circle cx="670" cy="40" r="3" fill="#38BDF8" fill-opacity="0.55" />
  <path d="M 520 154 H 640 L 658 136 H 710" stroke="#7DD3FC" stroke-opacity="0.25" stroke-width="1.5" />
  <circle cx="710" cy="136" r="3" fill="#7DD3FC" fill-opacity="0.5" />

  <rect class="star1" x="580" y="54" width="6" height="6" fill="#38BDF8" />
  <rect class="star2" x="645" y="68" width="5" height="5" fill="#F7D02C" />
  <rect class="star3" x="780" y="42" width="6" height="6" fill="#7DD3FC" />
  <rect class="star1" x="615" y="118" width="5" height="5" fill="#38BDF8" />
  <rect class="star2" x="785" y="130" width="6" height="6" fill="#F7D02C" />

  <g class="pokeball-wiggle">
    <circle cx="735" cy="82" r="40" fill="#071830" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2.5" />
    <path d="M 699 82 A 36 36 0 0 1 771 82 Z" fill="#E3350D" />
    <path d="M 699 82 A 36 36 0 0 0 771 82 Z" fill="#F0F6FC" />
    <rect x="698" y="78" width="74" height="8" fill="#071830" />
    <circle cx="735" cy="82" r="11" fill="#071830" />
    <circle cx="735" cy="82" r="6.5" fill="#F0F6FC" />
    <circle cx="735" cy="82" r="2.8" fill="#38BDF8" />
  </g>

  <g class="float-el">
    <rect x="36" y="30" width="92" height="22" rx="4" fill="#F7D02C" />
    <text x="82" y="45" text-anchor="middle" class="badge-text">⚡ ELECTRIC</text>

    <rect x="138" y="30" width="84" height="22" rx="4" fill="#38BDF8" />
    <text x="180" y="45" text-anchor="middle" class="badge-text">💧 WATER</text>

    <rect x="232" y="30" width="96" height="22" rx="4" fill="#A5B4FC" />
    <text x="280" y="45" text-anchor="middle" class="badge-text">🤖 AI / DATA</text>
  </g>

  <text x="36" y="94" class="title">Hi, I'm Karine Figueiredo!</text>
  <text x="36" y="122" class="subtitle">Data &amp; AI Enthusiast  |  Machine Learning &amp; Software Engineering</text>

  <text x="36" y="152" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#BAE6FD">DEV LV. 99</text>
  <rect x="118" y="141" width="224" height="12" rx="3" fill="#071830" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5" />
  <rect class="xp-fill" x="120" y="143" width="220" height="8" rx="2" fill="#38BDF8" />

  <rect x="34" y="172" width="752" height="60" rx="8" fill="#071830" fill-opacity="0.85" stroke="#7DD3FC" stroke-width="2.2" />
  <text x="54" y="207" class="dialog-text">
    ▶ Wild KARINE appeared! Ready to build clean, functional solutions
  </text>
  <polygon class="cursor" points="755,211 767,211 761,220" fill="#38BDF8" />
</svg>
