<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes fillBar {
      0% { width: 40px; }
      60% { width: 230px; }
      100% { width: 230px; }
    }
    @keyframes spinBall {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-12deg); }
      75% { transform: rotate(12deg); }
    }
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 30px;
      fill: #F0F6FC;
    }
    .subtitle {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 13.5px;
      fill: #79C0FF;
    }
    .dialog-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 14.5px;
      fill: #E6EDF3;
    }
    .badge-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 12px;
      fill: #071324;
    }
    .float-el { animation: floatSlow 3.5s infinite ease-in-out; }
    .cursor { animation: blink 1s infinite; }
    .xp-fill { animation: fillBar 4s ease-out forwards; }
    .pokeball-wiggle {
      transform-origin: 825px 82px;
      animation: spinBall 2.8s infinite ease-in-out;
    }
  </style>

  <defs>
    <linearGradient id="techBlueBg" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071830" />
      <stop offset="50%" stop-color="#0E2A52" />
      <stop offset="100%" stop-color="#1A5FA8" />
    </linearGradient>
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38BDF8" stroke-opacity="0.11" stroke-width="1" />
    </pattern>
    <clipPath id="avatarClip">
      <circle cx="115" cy="130" r="76" />
    </clipPath>
  </defs>

  <rect x="2" y="2" width="896" height="256" rx="16" fill="url(#techBlueBg)" stroke="#2563EB" stroke-opacity="0.65" stroke-width="2" />
  <rect x="2" y="2" width="896" height="256" rx="16" fill="url(#techGrid)" />

  <circle cx="115" cy="130" r="82" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="115" cy="130" r="78" fill="#071830" stroke="#7DD3FC" stroke-width="3" />

  
  

  <g class="pokeball-wiggle">
    <circle cx="825" cy="82" r="38" fill="#071830" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="2.5" />
    <path d="M 791 82 A 34 34 0 0 1 859 82 Z" fill="#E3350D" />
    <path d="M 791 82 A 34 34 0 0 0 859 82 Z" fill="#F0F6FC" />
    <rect x="790" y="78" width="70" height="8" fill="#071830" />
    <circle cx="825" cy="82" r="10.5" fill="#071830" />
    <circle cx="825" cy="82" r="6" fill="#F0F6FC" />
    <circle cx="825" cy="82" r="2.6" fill="#38BDF8" />
  </g>

  <g class="float-el">
    <rect x="224" y="30" width="92" height="22" rx="4" fill="#F7D02C" />
    <text x="270" y="45" text-anchor="middle" class="badge-text">⚡ ELECTRIC</text>

    <rect x="326" y="30" width="84" height="22" rx="4" fill="#38BDF8" />
    <text x="368" y="45" text-anchor="middle" class="badge-text">💧 WATER</text>

    <rect x="420" y="30" width="96" height="22" rx="4" fill="#A5B4FC" />
    <text x="468" y="45" text-anchor="middle" class="badge-text">🤖 AI / DATA</text>
  </g>

  <text x="224" y="94" class="title">Hi, I'm Karine Figueiredo!</text>
  <text x="224" y="122" class="subtitle">Data &amp; AI Enthusiast | Machine Learning &amp; Software Eng.</text>

  <text x="224" y="152" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#BAE6FD">DEV LV. 99</text>
  <rect x="306" y="141" width="234" height="12" rx="3" fill="#071830" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5" />
  <rect class="xp-fill" x="308" y="143" width="230" height="8" rx="2" fill="#38BDF8" />

  <rect x="224" y="172" width="644" height="58" rx="8" fill="#071830" fill-opacity="0.85" stroke="#7DD3FC" stroke-width="2.2" />
  <text x="242" y="206" class="dialog-text">
    ▶ Wild KARINE appeared! Ready to build clean, functional solutions
  </text>
  <polygon class="cursor" points="842,210 854,210 848,219" fill="#38BDF8" />
</svg>
